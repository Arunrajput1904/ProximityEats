<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Successful</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #4e73df, #1cc88a);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card {
            background: #ffffff;
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            text-align: center;
            width: 360px;
        }
        /* Checkmark Animation Icon */
        .success-icon {
            width: 80px;
            height: 80px;
            background-color: #e8fadf;
            color: #1cc88a;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            margin: 0 auto 20px auto;
        }
        h2 {
            color: #333333;
            margin-bottom: 10px;
        }
        p.subtitle {
            color: #666666;
            font-size: 14px;
            margin-bottom: 25px;
        }
        .details-box {
            background-color: #f8f9fc;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 25px;
            text-align: left;
        }
        .details-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 14px;
            color: #555555;
        }
        .details-row:last-child {
            margin-bottom: 0;
        }
        .details-row strong {
            color: #222222;
        }
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 12px;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 14px;
            transition: opacity 0.2s;
        }
        .btn-primary {
            background-color: #1cc88a;
            color: #ffffff;
        }
        .btn-secondary {
            background-color: #eaecf4;
            color: #5a5c69;
        }
        .btn:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

<div class="card">
    <div class="success-icon">✓</div>
    <h2>Payment Successful!</h2>
    <p class="subtitle">Thank you for your order. Your transaction has been completed.</p>

    <!-- Order Details -->
    <div class="details-box">
        <div class="details-row">
            <span>Order ID:</span>
            <strong th:text="${orderId != null ? orderId : 'N/A'}">#12345</strong>
        </div>
        <div class="details-row" th:if="${paymentId != null}">
            <span>Payment ID:</span>
            <strong th:text="${paymentId}">pay_xyz123</strong>
        </div>
        <div class="details-row">
            <span>Status:</span>
            <strong style="color: #1cc88a;">COMPLETED</strong>
        </div>
    </div>

    <!-- Navigation Buttons -->
    <div class="btn-group">
        <a th:href="@{/}" class="btn btn-primary">Back to Home</a>
    </div>
</div>

</body>
</html>
