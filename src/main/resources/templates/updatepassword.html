<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Change Password</title>

    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(120deg, #f6d365, #fda085);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background: white;
            padding: 30px;
            width: 400px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        button {
            width: 100%;
            padding: 10px;
            background: #ff7f50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #ff6347;
        }

        #message {
            margin-top: 12px;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">
    <h2>Change Password</h2>

    <form id="changePasswordForm">

        <div class="form-group">
            <label>Email</label>
            <input type="email" id="email" required>
        </div>

        <div class="form-group">
            <label>Otp</label>
            <input type="text" id="otp" required>
        </div>

        <div class="form-group">
            <label>New Password</label>
            <input type="password" id="setNewPassword" required minlength="6">
        </div>

        <button type="submit">Update Password</button>

        <p id="message"></p>
    </form>
</div>

<script>
    document.getElementById("changePasswordForm").addEventListener("submit", function(e) {
        e.preventDefault();

        const data = {
            email: document.getElementById("email").value.trim(),
            otp: document.getElementById("otp").value.trim(),
            setNewPassword: document.getElementById("setNewPassword").value.trim()
        };

        // basic validation
        if (data.setNewPassword.length < 6) {
            showMessage("Password must be at least 6 characters!", "red");
            return;
        }

        fetch("/auth/change-password", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(data)
        }).then(response => {
            if (!response.ok) {
       return response.text().then(text => { throw new Error(text) });
            }
            return response.text();
        })
        .then(data => {
            showMessage("Password change successful!", "success");
            window.location.href = "/login";
        })
        .catch(err => {
        alert(err.message);
        window.location.href="/emailsend.html";
        });
    });

    function showMessage(msg, color) {
        const el = document.getElementById("message");
        el.innerText = msg;
        el.style.color = color;
    }
</script>

</body>
</html>
