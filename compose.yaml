services:


    postgres:
      image: postgres:16
      container_name: Restaurant-pg
      ports:
        - "5343:5432"
      environment:
        POSTGRES_DB: postgres
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: arun

      volumes:
        -   pgdata:/var/lib/postgresql/data
        - ./src/main/resources/data.sql:/docker-entrypoint-initdb.d/init.sql:ro
      networks:
        - restaurant-networks

      healthcheck:
        test:
          [
            "CMD-SHELL",
            "pg_isready -U postgres -d postgres"
          ]
        interval: 10s
        timeout: 5s
        retries: 5



    kafka:
       image: apache/kafka:4.3.1
       container_name: res-kafka
       ports:
         - "9092:9092"
       environment:
         KAFKA_NODE_ID: 1

         KAFKA_PROCESS_ROLES: broker,controller


         KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093

         KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092

         KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT

         KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

         KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

         KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

         KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

         KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

         KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

         KAFKA_NUM_PARTITIONS: 3

       networks:
           - restaurant-networks
       healthcheck:
         test:
           [
             "CMD-SHELL",
             "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list > /dev/null 2>&1"
           ]
         interval: 10s
         timeout: 5s
         retries: 10



    restaurant_application:
           container_name: restaurant-application
           build:
             context: .
             dockerfile: Dockerfile

           environment:
             SPRING_APPLICATION_NAME: Restaurantbackend
             SERVER_PORT: 8182


             SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/postgres
             SPRING_DATASOURCE_USERNAME: postgres
             SPRING_DATASOURCE_PASSWORD: arun
             SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
             SPRING_JPA_HIBERNATE_DDL_AUTO: update


           ports:
             - "8182:8182"

           depends_on:
              postgres:
                condition: service_healthy


              kafka:
                condition: service_healthy


           networks:
              - restaurant-networks


volumes:
  pgdata:



networks:
  restaurant-networks:
      driver: bridge